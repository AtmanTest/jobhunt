<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunt · QA Dashboard</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/v3.css?1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .qa-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .qa-hdr { margin-bottom: 2rem; }
    .qa-hdr h1 { font-size: 1.8rem; margin: 0; }
    .qa-hdr p { color: var(--text-dim); margin: 0.3rem 0 0; }
    .qa-stats { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .qa-stat { background: var(--card); border-radius: 10px; padding: 1rem 1.5rem; min-width: 120px; text-align: center; border: 1px solid var(--border); }
    .qa-stat .num { font-size: 1.8rem; font-weight: 700; display: block; }
    .qa-stat .lbl { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.2rem; }
    .qa-stat.pass .num { color: var(--green); }
    .qa-stat.fail .num { color: var(--red); }
    .qa-stat.skip .num { color: var(--orange); }
    .qa-stat.total .num { color: var(--blue); }
    .module { margin-bottom: 2rem; }
    .module h2 { font-size: 1.1rem; margin: 0 0 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .test-card { background: var(--card); border-radius: 8px; margin-bottom: 0.4rem; overflow: hidden; border: 1px solid var(--border); }
    .test-hdr { display: flex; align-items: center; padding: 0.7rem 1rem; cursor: pointer; gap: 0.6rem; }
    .test-hdr:hover { background: var(--card-hover); }
    .test-hdr .icon { font-size: 1rem; width: 20px; }
    .test-hdr .icon.pass { color: var(--green); }
    .test-hdr .icon.fail { color: var(--red); }
    .test-hdr .icon.skip { color: var(--orange); }
    .test-hdr .icon.unknown { color: var(--text-dim); }
    .test-hdr .name { flex: 1; font-size: 0.88rem; color: var(--text); }
    .test-hdr .badge { font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .badge-critical { background: var(--red-dim); color: var(--red); }
    .badge-high { background: rgba(251,146,60,0.15); color: var(--orange); }
    .badge-medium { background: rgba(251,191,36,0.15); color: var(--orange); }
    .badge-low { background: var(--blue-dim); color: var(--blue); }
    .badge-info { background: var(--bg); color: var(--text-dim); }
    .test-detail { padding: 0 1rem 0.8rem; font-size: 0.8rem; color: var(--text-dim); display: none; line-height: 1.5; }
    .test-detail.open { display: block; }
    .test-detail code { background: var(--bg); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.75rem; }
  </style>
</head>
<body>
<header class="header">
  <a href="/" class="header-logo" style="text-decoration:none;">⚡ JobHunt · QA Dashboard</a>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Basculer thème">☀️</button>
  </div>
</header>
<div class="qa-wrap">
  <div class="qa-hdr">
    <h1><i class="fas fa-flask"></i> Tests QA</h1>
    <p>Inventaire réel du dépôt (BDD + pytest, parcours Playwright inclus) — <span id="ts"></span></p>
  </div>

  <div class="qa-stats" id="stats">
    <div class="qa-stat total"><span class="num" id="total-n">0</span><span class="lbl">Collectés</span></div>
    <div class="qa-stat pass"><span class="num" id="pass-n">0</span><span class="lbl">OK</span></div>
    <div class="qa-stat fail"><span class="num" id="fail-n">0</span><span class="lbl">Échec</span></div>
    <div class="qa-stat skip"><span class="num" id="skip-n">0</span><span class="lbl">Ignoré</span></div>
  </div>

  <div id="modules"></div>
</div>

<script>
/*
 * Aucun statut inventé : la liste vient de la collecte réelle (pytest --collect-only
 * + fichiers .feature). Un test jamais exécuté est « Collecté », jamais « Échec ».
 * Les colonnes OK / Échec / Ignoré se remplissent à partir des rapports d'exécution.
 */
const ICONS = {pass: 'fa-check-circle', fail: 'fa-times-circle', skip: 'fa-minus-circle', unknown: 'fa-circle'};
const LABELS = {pass: 'OK', fail: 'Échec', skip: 'Ignoré', unknown: 'Collecté'};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

async function load() {
  const mods = document.getElementById('modules');
  mods.innerHTML = '<p style="color:var(--text-dim)">Collecte des tests en cours…</p>';
  let data;
  try {
    const r = await fetch('/qa/api/test-cases');
    data = await r.json();
  } catch (e) {
    mods.innerHTML = '<p style="color:var(--red)">Collecte indisponible : ' + esc(e) + '</p>';
    return;
  }

  const modules = data.modules || [];
  let total = 0, pass = 0, fail = 0, skip = 0;
  let html = '';

  modules.forEach(mod => {
    html += '<div class="module"><h2>' + esc(mod.name) +
            ' <span style="font-weight:400;font-size:0.8rem;color:var(--text-dim)">(' + mod.tests.length + ')</span></h2>';
    mod.tests.forEach(t => {
      total++;
      const st = t.status || 'unknown';
      if (st === 'pass') pass++;
      else if (st === 'skip') skip++;
      else if (st === 'fail') fail++;
      html += '<div class="test-card">' +
        '<div class="test-hdr" onclick="this.nextElementSibling.classList.toggle(\'open\')">' +
          '<span class="icon ' + st + '"><i class="fas ' + (ICONS[st] || ICONS.unknown) + '"></i></span>' +
          '<span class="name">' + esc(t.name) + '</span>' +
          '<span class="badge badge-' + esc(t.severity || 'info') + '">' + (LABELS[st] || 'Collecté') + '</span>' +
        '</div>' +
        '<div class="test-detail">' + (t.detail || '') + '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  mods.innerHTML = html || '<p style="color:var(--text-dim)">Aucun test collecté.</p>';
  document.getElementById('total-n').textContent = total;
  document.getElementById('pass-n').textContent = pass;
  document.getElementById('fail-n').textContent = fail;
  document.getElementById('skip-n').textContent = skip;
  document.getElementById('ts').textContent =
    new Date().toLocaleString('fr-FR', {day: '2-digit', month: '2-digit', year: 'numeric',
                                        hour: '2-digit', minute: '2-digit', second: '2-digit'});
}

load();
</script>
<script>
(function(){
  var theme = localStorage.getItem('jh-theme') || '';
  var btn = document.getElementById('theme-btn');
  if(theme==='dark'){document.documentElement.removeAttribute('data-theme');btn.textContent='☀️';}else{document.documentElement.setAttribute('data-theme','light');btn.textContent='🌙';}
  window.toggleTheme=function(){var t=document.documentElement.getAttribute('data-theme');if(t==='light'){document.documentElement.removeAttribute('data-theme');localStorage.setItem('jh-theme','dark');btn.textContent='☀️';}else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('jh-theme','');btn.textContent='🌙';}};
})();
</script>
</body>
</html>
